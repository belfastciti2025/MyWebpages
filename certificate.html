<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pledge Certificate — 1% Club</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="theme.css">
<style>
.cert-box{max-width:800px;margin:auto;border:3px solid #1F7A8C;border-radius:16px;padding:40px;background:white}
.cert-title{font-size:2rem;font-weight:800;text-align:center}
.cert-name{font-size:1.6rem;font-weight:700;text-align:center;margin-top:20px}
.cert-body{text-align:center;margin-top:10px}
@media print{#form,button{display:none}body{background:white}}
</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <div id="form" class="card p-3 mb-3">
    <label class="form-label">Enter your name for the certificate</label>
    <input id="name" class="form-control" placeholder="Your name">
    <button class="btn btn-primary mt-3" onclick="generate()">Generate Certificate</button>
  </div>

  <div id="certificate" class="cert-box d-none">
    <div class="cert-title">1% CLUB PLEDGE CERTIFICATE</div>
    <div class="cert-body">This certifies that</div>
    <div class="cert-name" id="certName"></div>
    <div class="cert-body">has pledged to contribute <b>1% of their income for social good</b>.</div>
    <div class="cert-body mt-4">— 1% Club</div>
  </div>

  <div class="text-center mt-3 d-none" id="printBtn">
    <button class="btn btn-outline-primary" onclick="window.print()">Download / Print</button>
  </div>
</div>

<script>
function generate(){
  const n=document.getElementById('name').value.trim();
  if(!n) return alert('Please enter a name');
  document.getElementById('certName').innerText=n;
  document.getElementById('certificate').classList.remove('d-none');
  document.getElementById('printBtn').classList.remove('d-none');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
